[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_FONT2=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
    -D ONE_WIRE_PIN=27

; Optional screen preview, visibly labelled DEMO. Default cyd reads the sensor.
[env:demo]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D THERMOMETER_DEMO=1

