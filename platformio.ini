[platformio]
default_envs = cyd

; Shared wiring for the ILI9341 CYD and common CYD2USB ST7789 variant.
; Confirm your PCB pinout: a controller name alone does not identify a board.
[thermometer]
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_FONT2=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
    -D ONE_WIRE_PIN=27

[env]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6

; Original ILI9341 profile: the default Build/Upload target.
[env:cyd]
build_flags =
    ${thermometer.build_flags}
    -D ILI9341_2_DRIVER=1
    -D DISPLAY_INVERT=1

[env:demo]
build_flags =
    ${env:cyd.build_flags}
    -D THERMOMETER_DEMO=1

; Common CYD2USB ST7789 profile: BGR colour order, inversion OFF.
[env:cyd_st7789]
build_flags =
    ${thermometer.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D DISPLAY_INVERT=0

[env:demo_st7789]
build_flags =
    ${env:cyd_st7789.build_flags}
    -D THERMOMETER_DEMO=1
